name: Desktop packages
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'packaging/**'
      - 'backend/**'
      - '.github/workflows/desktop-release.yml'
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - '.github/workflows/desktop-release.yml'
      - 'desktop/**'
      - 'backend/**'
      - 'packaging/**'
permissions:
  contents: read
jobs:
  build:
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' &&
       startsWith(github.event.head_commit.message, 'publish: TokenForge v0.3.8'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install -r backend/requirements-desktop.txt "pyinstaller>=6.15,<7"
      - run: python desktop/build.py
      - name: Smoke-test frozen executable before upload
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) desktop/dist/TokenForge/TokenForge.exe --self-test ;;
            macOS) desktop/dist/TokenForge.app/Contents/MacOS/TokenForge --self-test ;;
            Linux) desktop/dist/TokenForge/TokenForge --self-test ;;
          esac
      - name: Audit release package for tests and server files
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS) python desktop/audit_bundle.py desktop/dist/TokenForge.app ;;
            *) python desktop/audit_bundle.py desktop/dist/TokenForge ;;
          esac
      - name: Check macOS Finder file registration
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -c 'import plistlib; from pathlib import Path; p=Path("desktop/dist/TokenForge.app/Contents/Info.plist"); assert plistlib.load(p.open("rb"))["CFBundleDocumentTypes"]'
      - name: Zip Windows application folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path desktop/dist/TokenForge -DestinationPath TokenForge-Windows-x64.zip
      - name: Build an installed Windows app with Start Menu and Open With integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $compiler)) { throw "Inno Setup 6 was not installed" }
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}".TrimStart("v")
          } else { "0.3.8" }
          & $compiler "/DAppVersion=$version" "packaging\windows\TokenForge.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "desktop\dist\installers\TokenForge-Setup-Windows-x64.exe" -Destination "TokenForge-Setup-Windows-x64.exe"
      - name: Build single-file Windows portable EXE
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python desktop/build.py --portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "desktop/dist/TokenForge-Portable.exe")) {
            throw "Missing one-file portable executable"
          }
      - name: Verify USB-ready single-file program
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TOKENFORGE_SELFTEST_REPORT = "portable-self-test.txt"
          # Windows GUI programs can return control to PowerShell before they exit.
          # Start-Process -Wait checks the completed app, not a stale LASTEXITCODE.
          $portable = (Resolve-Path "desktop/dist/TokenForge-Portable.exe").Path
          $process = Start-Process -FilePath $portable -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $env:TOKENFORGE_SELFTEST_REPORT) {
              Get-Content $env:TOKENFORGE_SELFTEST_REPORT
            }
            throw "Single-file offline self-test failed with exit code $($process.ExitCode)"
          }
          Copy-Item "desktop/dist/TokenForge-Portable.exe" "TokenForge-Portable-Windows-x64.exe"
      - name: Zip actual macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -d desktop/dist/TokenForge.app
          arch=$(uname -m)
          ditto -c -k --sequesterRsrc --keepParent desktop/dist/TokenForge.app "TokenForge-macOS-${arch}.zip"
      - name: Archive Linux executable with its permissions
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp packaging/linux/tokenforge.desktop desktop/dist/TokenForge/
          cp packaging/linux/install-user.sh desktop/dist/TokenForge/
          sh -n desktop/dist/TokenForge/install-user.sh
          tar -C desktop/dist -czf TokenForge-Linux-x64.tar.gz TokenForge
      - uses: actions/upload-artifact@v4
        with:
          name: TokenForge-${{ matrix.label }}
          path: |
            TokenForge-*.zip
            TokenForge-*.tar.gz
            TokenForge-Setup-*.exe
            TokenForge-Portable-Windows-x64.exe
          if-no-files-found: error
  publish:
    if: >-
      needs.build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'publish: TokenForge v0.3.8')))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TokenForge-*
          merge-multiple: true
      - name: Refuse incomplete desktop releases
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            TokenForge-Windows-x64.zip
            TokenForge-Setup-Windows-x64.exe
            TokenForge-Portable-Windows-x64.exe
            TokenForge-Linux-x64.tar.gz
          )
          for file in "${expected[@]}"; do
            test -s "$file" || { echo "::error::Missing or empty $file"; exit 1; }
          done
          shopt -s nullglob
          mac=(TokenForge-macOS-*.zip)
          if [ "${#mac[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one macOS archive"
            exit 1
          fi
          test -s "${mac[0]}"
          unzip -tq TokenForge-Windows-x64.zip
          unzip -Z -1 TokenForge-Windows-x64.zip > windows-contents.txt
          grep -Fx 'TokenForge/TokenForge.exe' windows-contents.txt
          grep '^TokenForge/_internal/' windows-contents.txt > /dev/null
          sha256sum "${expected[@]}" "${mac[@]}" > SHA256SUMS.txt
      - name: Publish verified files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.3.8' }}
          target_commitish: ${{ github.sha }}
          name: TokenForge ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.3.8' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            TokenForge-*.zip
            TokenForge-*.tar.gz
            TokenForge-Setup-*.exe
            TokenForge-Portable-Windows-x64.exe
            SHA256SUMS.txt
      - name: Verify each public release download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.3.8' }}"
          names="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for file in TokenForge-Windows-x64.zip TokenForge-Setup-Windows-x64.exe \
                      TokenForge-Portable-Windows-x64.exe TokenForge-Linux-x64.tar.gz \
                      SHA256SUMS.txt; do
            echo "$names" | grep -Fx "$file" || {
              echo "::error::Release $tag missing $file"; exit 1;
            }
          done
          echo "$names" | grep -E '^TokenForge-macOS-.*[.]zip$' || {
            echo "::error::Release $tag missing macOS"; exit 1;
          }
      - name: Hide superseded empty v0.3.5 release without deleting its tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.3.5 --json assets >/dev/null 2>&1; then
            count="$(gh release view v0.3.5 --json assets --jq '.assets | length')"
            if [ "$count" = 0 ]; then
              gh release edit v0.3.5 --draft
            fi
          fi
