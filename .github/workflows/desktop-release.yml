name: Desktop packages
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'backend/**'
      - '.github/workflows/desktop-release.yml'
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
    runs-on: \${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install -r backend/requirements-desktop.txt "pyinstaller>=6.15,<7"
      - run: python desktop/build.py
      - name: Smoke-test frozen executable before upload
        shell: bash
        run: |
          case "\${{ runner.os }}" in
            Windows) desktop/dist/TokenForge/TokenForge.exe --self-test ;;
            macOS) desktop/dist/TokenForge.app/Contents/MacOS/TokenForge --self-test ;;
            Linux) desktop/dist/TokenForge/TokenForge --self-test ;;
          esac
      - name: Zip Windows application folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path desktop/dist/TokenForge -DestinationPath TokenForge-Windows-x64.zip
      - name: Zip actual macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -d desktop/dist/TokenForge.app
          arch=$(uname -m)
          ditto -c -k --sequesterRsrc --keepParent desktop/dist/TokenForge.app "TokenForge-macOS-\${arch}.zip"
      - name: Archive Linux executable with its permissions
        if: runner.os == 'Linux'
        shell: bash
        run: tar -C desktop/dist -czf TokenForge-Linux-x64.tar.gz TokenForge
      - uses: actions/upload-artifact@v4
        with:
          name: TokenForge-\${{ matrix.label }}
          path: |
            TokenForge-*.zip
            TokenForge-*.tar.gz
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TokenForge-*.zip
            TokenForge-*.tar.gz
