name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install -r backend/requirements-desktop.txt "pyinstaller>=6.15,<7"
      - run: python desktop/build.py
      - shell: pwsh
        run: Compress-Archive -Path desktop/dist/TokenForge -DestinationPath TokenForge-${{ matrix.label }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TokenForge-${{ matrix.label }}
          path: TokenForge-${{ matrix.label }}.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TokenForge-${{ matrix.label }}.zip
