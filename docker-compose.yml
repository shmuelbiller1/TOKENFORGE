# One command:  docker compose up -d --build   →   open http://localhost:8080
# Override secrets in a root .env file (see .env.docker.example) before exposing it to a network.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: tokenforge
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGINS: ${FRONTEND_URL:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-change-me-please-use-a-long-random-string}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tokenforge.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe!12345}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORT:-8080}:80"

volumes:
  mongo-data:
